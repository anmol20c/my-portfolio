<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmol Choudhary</title>
<meta name="description" content="Anmol Choudhary: AI/ML and Generative AI developer. A portfolio that opens like a desktop.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#fff;--mute:#a9a9b6;--glass:rgba(28,28,34,.72);--line:rgba(255,255,255,.14);--pink:#ff7ab8;--blue:#8fb8ff;color-scheme:dark;
--sans:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;--script:'Pinyon Script','Snell Roundhand',cursive;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
/* menubar */
#bar{position:fixed;top:0;left:0;right:0;z-index:60;height:calc(30px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 22px 0;display:flex;align-items:center;gap:6px;background:linear-gradient(#000c,#0000);backdrop-filter:blur(6px);font-weight:500;font-size:15px}
#bar .m{padding:2px 10px;border-radius:6px}
#bar .m:hover,#bar .m[aria-expanded=true]{background:#ffffff22}
#bar .logo{position:absolute;left:50%;transform:translateX(-50%);font:italic 600 20px var(--script);font-family:var(--script)}
#bar .r{margin-left:auto;display:flex;gap:16px;align-items:center}
#dd{position:fixed;top:calc(30px + env(safe-area-inset-top,0px));z-index:70;min-width:190px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:10px;padding:5px;display:none}
#dd.on{display:block}
#dd button{display:block;width:100%;text-align:left;padding:5px 12px;border-radius:6px}
#dd button:hover{background:#3b7bff}
/* sections */
section{position:relative;height:100vh;height:100svh;scroll-snap-align:start;z-index:1;overflow:hidden}
#hero .side{position:absolute;top:47%;font-size:13px;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
#hero .l{left:4.3%}#hero .rr{right:4.3%;text-align:right}
#flower{position:fixed;left:50%;top:44%;width:min(70vh,92vw);transform:translate(-50%,-50%);z-index:0;pointer-events:none;overflow:visible;will-change:transform}
#name{position:absolute;left:0;right:0;bottom:3vh;z-index:2;text-align:center;font:400 clamp(56px,11.4vw,220px)/1.45 var(--script);white-space:nowrap;text-shadow:0 0 40px #8fb8ff44;margin:0;padding:0 1vw}
#down{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);opacity:.7;z-index:3;font-size:20px}
/* desktop */
#desk .it{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;text-align:center;font-size:15px;font-weight:500;text-shadow:0 1px 8px #000}
#desk .it small{display:block;color:var(--mute);font-size:12px;font-weight:400}
#desk .it:hover svg,#desk .it:hover .tile{transform:translateY(-4px) scale(1.04)}
#desk svg,#desk .tile{transition:transform .2s}
.fold{width:110px;height:92px}
.tile{width:min(210px,40vw);border-radius:22px;background:#111;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;position:relative}
.petal{position:absolute;width:60px;height:120px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#8fb8ff66,#ffffff11);border:1px solid #fff3;pointer-events:none;animation:fall linear infinite;opacity:.8}
@keyframes fall{from{transform:translateY(-14vh) rotate(0)}to{transform:translateY(112vh) rotate(260deg)}}
#dock{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:12px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;z-index:5}
#dock button,#dock a{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:600;font-size:15px;text-decoration:none;color:#fff;transition:transform .15s;transform-origin:50% 100%}
#dock button:hover,#dock a:hover{transform:scale(1.4) translateY(-6px)}
#dock i{width:1px;height:42px;background:var(--line);align-self:center}
/* windows */
.win{position:fixed;z-index:50;width:min(560px,94vw);max-height:78vh;background:var(--glass);backdrop-filter:blur(26px);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px #000c;display:flex;flex-direction:column;animation:pop .22s}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.win header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:grab;touch-action:none;border-bottom:1px solid var(--line);font-weight:600}
.win header b{flex:1;text-align:center;margin-right:42px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff5f57;position:relative;cursor:pointer;flex:none}
.dot.y{background:#febc2e}.dot.g{background:#28c840}
.win .body{padding:18px 22px;overflow:auto}
.win h3{margin:0 0 6px;font-size:20px}
.win p{color:var(--mute);margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0 0 12px;list-style:none}
.tags li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:#d8d8e4}
.btn{display:inline-block;margin:0 8px 6px 0;padding:6px 14px;border-radius:999px;background:#fff;color:#000;text-decoration:none;font-weight:500}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;margin:0 0 12px}
.kv dt{color:var(--pink)}.kv dd{margin:0}
.term{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#7bf0a8;background:#050805}
.term input{width:100%;background:none;border:0;color:inherit;font:inherit;outline:0}
.term pre{margin:0;white-space:pre-wrap;font:inherit}
.tl{border-left:1px solid var(--line);margin:0 0 0 4px;padding-left:16px}
.tl div{margin-bottom:14px}
.tl small{color:var(--pink)}
.win header:hover .dot::after,.lights:hover .dot::after{content:attr(data-g);position:absolute;inset:0;display:grid;place-items:center;font-size:10px;line-height:1;font-weight:700;color:#0009}
.win.max{left:8px!important;top:38px!important;width:calc(100vw - 16px);max-height:calc(100vh - 50px)}
.ap{width:15px;height:18px;fill:#fff;margin-right:8px}
.ic{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
#pond{position:fixed;inset:0;z-index:40;background:#0a0f24;animation:pop .3s;touch-action:manipulation}
#pond canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}
#pond .lights{position:absolute;left:24px;top:calc(46px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:2}
#pond .pcard{position:absolute;left:24px;top:calc(78px + env(safe-area-inset-top,0px));width:min(340px,88vw);padding:18px 20px;background:rgba(14,18,40,.72);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;font-family:ui-monospace,Menlo,Consolas,monospace;z-index:2}
#pond h4{margin:0;font-size:18px}#pond small{color:var(--mute);letter-spacing:.08em}
#pond .pcard p{margin:10px 0}
#pond .pf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}
#pond .pf button{border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.pd{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:12px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;z-index:2}
.pd button,.pd a{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:600;font-size:15px;text-decoration:none;color:#fff;transition:transform .15s;transform-origin:50% 100%}
.pd button:hover,.pd a:hover{transform:scale(1.4) translateY(-6px)}
.pd i{width:1px;height:42px;background:var(--line);align-self:center}
@media (max-width:760px){.pd{gap:6px;padding:8px}.pd button,.pd a{width:44px;height:44px}}
@media (max-width:760px){
#hero .side{top:30%;font-size:11px}
#desk{overflow:auto}
#desk .grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:18px 4px;padding:60px 10px 130px}
#desk .it{position:static;width:auto}
#desk .abs{display:none}
#dock{gap:6px;padding:8px}
#dock button,#dock a{width:44px;height:44px}
.kv{grid-template-columns:1fr}
}
#desk .fold{width:clamp(76px,6.2vw,124px);height:auto}
#desk .it{width:auto;min-width:120px}
.wg{position:absolute;display:block;overflow:hidden;border-radius:20px;padding:0;transition:transform .2s}
button.wg:hover{transform:translateY(-4px) scale(1.02)}
.wg svg{width:100%;height:100%;display:block}
.wg.card{background:#0c0c0f;border:1px solid var(--line)}
@media (min-width:761px){#desk .it{transform:translateX(-50%)}}
@media (min-width:761px){#desk .grid{display:contents}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
#flower{display:none!important}
#bloom{mix-blend-mode:screen;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);width:min(92vh,100vw);height:min(92vh,100vw);z-index:0;pointer-events:none}
#desk .it{min-width:0;white-space:nowrap;font-size:clamp(11px,.95vw,15px)}
#desk .it small{font-size:clamp(10px,.8vw,12px)}
#pcv{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.petal{display:none!important}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="bloom" aria-hidden="true"></canvas>
<canvas id="pcv" aria-hidden="true"></canvas>
<div id="bar">
<span style="display:flex" aria-hidden="true"><svg class="ap" viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8C6.9 7.4 5.5 8.3 4.7 9.7c-1.6 2.8-.4 6.9 1.2 9.2.8 1.1 1.700 2.300 2.900 2.300 1.100 0 1.600-.7 3-.7s1.800.7 3 .7c1.200 0 2-1.100 2.800-2.200.9-1.300 1.200-2.500 1.200-2.600-.1 0-2.400-.9-2.400-3.800zM14.100 5.900c.6-.8 1.100-1.800.9-2.900-.9 0-2 .6-2.700 1.400-.6.700-1.100 1.800-1 2.800 1 .1 2.100-.5 2.800-1.300z"/></svg></span><span style="display:none" aria-hidden="true"></span>

<span class="logo">ac</span>
<span class="r"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a15 15 0 0120 0M5.500 12.500a10 10 0 0113 0M9 16a5 5 0 016 0"/><circle cx="12" cy="19.500" r="1" fill="#fff"/></svg><svg class="ic" style="width:26px" viewBox="0 0 28 14" aria-hidden="true"><rect x="1" y="1" width="22" height="12" rx="3"/><rect x="3" y="3" width="15" height="8" rx="1.500" fill="#fff" stroke="none"/><path d="M25.500 5v4"/></svg><span aria-hidden="true">⌕</span><time id="clock"></time></span>
</div>
<div id="dd" role="menu"></div>

<section id="hero" aria-label="Introduction">
<div class="side l">I am a<br>AI / ML developer</div>

<svg id="flower" viewBox="-300 -300 600 600" aria-hidden="true"><defs><radialGradient id="gl"><stop offset="0" stop-color="#9aa8ff" stop-opacity=".35"/><stop offset="1" stop-color="#9aa8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="pg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4c8ff" stop-opacity=".85"/><stop offset=".55" stop-color="#8fb8ff" stop-opacity=".55"/><stop offset="1" stop-color="#2a4f9a" stop-opacity=".35"/></linearGradient>
<path id="p" d="M0 0C-70 -50 -62 -160 0 -225C62 -160 70 -50 0 0Z" fill="url(#pg)" stroke="#fff" stroke-opacity=".35"/></defs>
<circle r="290" fill="url(#gl)"/><g id="layers"></g></svg>
<h1 id="name">Anmol Choudhary</h1>
<a id="down" href="#desk" aria-label="Scroll to desktop">⌄</a>
</section>

</section>
